name: Fog maps

on:
  schedule:
    - cron: "41 8 4-6 * *"   # 4th Namib, 5th Atacama, 6th California (one region per day keeps us inside Open-Meteo's free tier)
  workflow_dispatch:
    inputs:
      region:
        description: "Which coast to (re)build"
        type: choice
        options: [namib, atacama, california]
        default: namib

permissions:
  contents: write

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          cache: false
          environments: default
      - run: pixi run python src/fog_grid.py ${{ inputs.region || 'auto' }}
      - name: Commit data
        run: |
          git config user.name "fog-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/fog_grid.json
          git diff --cached --quiet && exit 0
          git commit -m "data: fog grid (${{ inputs.region || 'auto' }})"
          git pull --rebase
          git push
